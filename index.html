<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建功國小 - 抽班系統</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ecf0f1;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title {
            color: #d4af37;
            font-size: clamp(28px, 5vw, 36px);
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: clamp(20px, 5vw, 40px);
            border-radius: 20px;
            border: 1px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 700px;
            width: 100%;
            position: relative;
            box-sizing: border-box;
        }

        .tab-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .tab-btn {
            font-size: 18px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #d4af37;
            color: #bdc3c7;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .tab-btn.active {
            background: #d4af37;
            color: #0f2027;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
        
        .tab-btn:hover:not(.active) {
            background: rgba(212, 175, 55, 0.3);
            color: #fff;
        }
        
        .tab-content {
            display: none;
            width: 100%;
        }
        
        .tab-content.active {
            display: block;
        }

        .setup-area {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.4);
            text-align: left;
        }

        .setup-row {
            margin-bottom: 15px;
        }

        .setup-label {
            font-size: 18px;
            display: block;
            margin-bottom: 8px;
            color: #bdc3c7;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-selectable {
            padding: 8px 16px;
            border: 1px solid #d4af37;
            background: rgba(255, 255, 255, 0.05);
            color: #bdc3c7;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
        }

        .btn-selectable.active {
            background: #d4af37;
            color: #0f2027;
            font-weight: bold;
        }

        .btn-selectable:hover:not(.active) {
            background: rgba(212, 175, 55, 0.2);
            color: #fff;
        }

        .setup-actions {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #d4af37;
            color: #0f2027;
        }

        .btn-primary:hover {
            background: #f1c40f;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }

        .btn-danger:hover {
            background: #e74c3c;
            color: #fff;
        }

        .preview-box {
            font-size: 18px;
            color: #d4af37;
            font-weight: bold;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            min-height: 27px;
        }

        .draw-area {
            margin: 40px 0;
            position: relative;
        }

        .display-text {
            font-size: clamp(40px, 8vw, 80px);
            font-weight: bold;
            color: #fff;
            height: 1.5em;
            line-height: 1.5em;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            letter-spacing: 5px;
            transition: color 0.3s, transform 0.3s;
        }

        .draw-btn {
            padding: 15px 50px;
            font-size: clamp(20px, 4vw, 28px);
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #d4af37, #f1c40f);
            color: #0f2027;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .draw-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
        }

        .draw-btn:disabled {
            background: #7f8c8d;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .status-area {
            font-size: 18px;
            color: #bdc3c7;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
        }

        .remaining-text {
            color: #d4af37;
            font-weight: bold;
            line-height: 1.8;
            margin-top: 8px;
            font-size: 20px;
        }

        .corgi-wrapper {
            position: absolute;
            bottom: -60px;
            right: -40px;
            width: clamp(120px, 20vw, 180px);
            opacity: 0;
            transform: translateY(100px) scale(0.5) rotate(15deg);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            z-index: 20;
        }

        .corgi-wrapper.show {
            opacity: 1;
            transform: translateY(0) scale(1) rotate(0deg);
        }

        .corgi-wrapper img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
        }

        input[type="number"] {
            padding: 10px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #d4af37;
            color: #fff;
            border-radius: 8px;
            outline: none;
            text-align: center;
            width: 100px;
        }
        
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="header-title">建功國小｜抽班系統</div>

<div class="tab-group">
    <button id="btnClassTab" class="tab-btn active" onclick="switchTab('class')">抽班級</button>
    <button id="btnStudentTab" class="tab-btn" onclick="switchTab('student')">抽學生 (A, B, C...)</button>
</div>

<div class="container">
    
    <div id="classTab" class="tab-content active">
        <div class="setup-area">
            <div class="setup-row">
                <span class="setup-label">1. 選擇年級：</span>
                <div id="gradeSelector" class="btn-group"></div>
            </div>
            <div class="setup-row">
                <span class="setup-label">2. 選擇班級：</span>
                <div id="classSelector" class="btn-group"></div>
            </div>
            <div class="setup-row">
                <span class="setup-label">3. 準備名單：</span>
                <div id="previewText" class="preview-box">尚未選擇</div>
            </div>
            
            <div class="setup-actions">
                <button class="btn-action btn-danger" onclick="clearSelection()">清空選擇</button>
                <button class="btn-action btn-primary" onclick="applyPool()">確認並更新籤筒</button>
            </div>
        </div>

        <div class="draw-area">
            <div id="display" class="display-text">等待抽籤</div>
            <button id="drawBtn" class="draw-btn" onclick="startDraw()">開始抽籤</button>
            <div id="corgi-container" class="corgi-wrapper">
                <img src="https://cdn-icons-png.flaticon.com/512/3034/3034032.png" alt="慶祝柯基">
            </div>
        </div>

        <div class="status-area">
            目前籤筒剩餘班級：
            <div id="remainingClasses" class="remaining-text">請先更新籤筒</div>
        </div>
    </div>

    <div id="studentTab" class="tab-content">
        <div class="setup-area">
            <span class="setup-label">1. 請輸入預計抽籤的學生人數：</span>
            <div class="input-group">
                <input type="number" id="studentCount" value="5" min="1" max="100">
                <span style="font-size: 16px; color: #bdc3c7;">人 (將自動產生 A, B, C...)</span>
            </div>

            <span class="setup-label">2. 目前籤筒準備名單：</span>
            <div id="studentPreviewText" class="preview-box">尚未設定</div>
            
            <div class="setup-actions">
                <button class="btn-action btn-primary" onclick="applyStudentPool()">確認並更新籤筒</button>
            </div>
        </div>

        <div class="draw-area">
            <div id="studentDisplay" class="display-text">等待抽籤</div>
            <button id="studentDrawBtn" class="draw-btn" onclick="startStudentDraw()">開始抽籤</button>
            <div id="student-corgi-container" class="corgi-wrapper">
                <img src="https://cdn-icons-png.flaticon.com/512/3034/3034032.png" alt="慶祝柯基">
            </div>
        </div>

        <div class="status-area">
            目前籤筒剩餘學生：
            <div id="studentRemaining" class="remaining-text">請先更新籤筒</div>
        </div>
    </div>
</div>

<script>
    const allClasses = {
        '1': ['一班', '二班', '三班', '四班', '五班', '六班', '七班', '八班', '九班'],
        '2': ['一班', '二班', '三班', '四班', '五班', '六班', '七班', '八班', '九班'],
        '3': ['一班', '二班', '三班', '四班', '五班', '六班', '七班', '八班', '九班'],
        '4': ['一班', '二班', '三班', '四班', '五班', '六班', '七班', '八班', '九班'],
        '5': ['一班', '二班', '三班', '四班', '五班', '六班', '七班', '八班', '九班'],
        '6': ['一班', '二班', '三班', '四班', '五班', '六班', '七班', '八班', '九班']
    };

    let selectedGrade = '1';
    let selectedClasses = new Set(['一班', '二班', '三班', '四班']);
    let pool = [];
    let isDrawing = false;

    let studentPool = [];
    let isStudentDrawing = false;

    function switchTab(tab) {
        document.getElementById('classTab').style.display = tab === 'class' ? 'block' : 'none';
        document.getElementById('studentTab').style.display = tab === 'student' ? 'block' : 'none';
        
        if (tab === 'class') {
            document.getElementById('btnClassTab').classList.add('active');
            document.getElementById('btnStudentTab').classList.remove('active');
        } else {
            document.getElementById('btnClassTab').classList.remove('active');
            document.getElementById('btnStudentTab').classList.add('active');
        }
    }

    function initSelectors() {
        const gradeSelector = document.getElementById('gradeSelector');
        gradeSelector.innerHTML = '';
        Object.keys(allClasses).forEach(grade => {
            const btn = document.createElement('button');
            btn.className = `btn-selectable ${grade === selectedGrade ? 'active' : ''}`;
            btn.innerText = `${grade}年級`;
            btn.onclick = () => selectGrade(grade);
            gradeSelector.appendChild(btn);
        });
        
        renderClassSelector();
        updatePreview();
    }

    function selectGrade(grade) {
        selectedGrade = grade;
        initSelectors();
    }

    function renderClassSelector() {
        const classSelector = document.getElementById('classSelector');
        classSelector.innerHTML = '';
        allClasses[selectedGrade].forEach(cls => {
            const btn = document.createElement('button');
            btn.className = `btn-selectable ${selectedClasses.has(cls) ? 'active' : ''}`;
            btn.innerText = cls;
            btn.onclick = () => toggleClass(cls);
            classSelector.appendChild(btn);
        });
    }

    function toggleClass(cls) {
        if (selectedClasses.has(cls)) {
            selectedClasses.delete(cls);
        } else {
            selectedClasses.add(cls);
        }
        renderClassSelector();
        updatePreview();
    }

    function clearSelection() {
        selectedClasses.clear();
        pool = [];
        renderClassSelector();
        updatePreview();
        updateRemainingDisplay();
    }

    function updatePreview() {
        const preview = document.getElementById('previewText');
        if (selectedClasses.size === 0) {
            preview.innerText = "尚未選擇班級";
            preview.style.color = "#7f8c8d";
        } else {
            const list = Array.from(selectedClasses).map(cls => `${selectedGrade}年${cls}`);
            preview.innerText = list.join(' 、 ');
            preview.style.color = "#d4af37";
        }
    }

    function applyPool() {
        if (selectedClasses.size === 0) {
            const preview = document.getElementById('previewText');
            preview.innerText = "請至少選擇一個班級！";
            preview.style.color = "#e74c3c";
            return;
        }
        
        pool = Array.from(selectedClasses).map(cls => `${selectedGrade}年${cls}`);
        const display = document.getElementById('display');
        display.innerText = "等待抽籤";
        display.style.color = "#fff";
        display.style.transform = "scale(1)";
        
        hideCorgi();
        updateRemainingDisplay();
    }

    function updateRemainingDisplay() {
        const remainingContainer = document.getElementById('remainingClasses');
        const drawBtn = document.getElementById('drawBtn');
        
        if (pool.length > 0) {
            remainingContainer.innerText = pool.join(' 、 ');
            drawBtn.disabled = false;
        } else {
            remainingContainer.innerText = "籤筒已空！請重新選擇並更新。";
            drawBtn.disabled = true;
        }
    }

    function generateStudentLabels(count) {
        let labels = [];
        for (let i = 0; i < count; i++) {
            if (i < 26) {
                labels.push(String.fromCharCode(65 + i)); 
            } else {
                const firstChar = String.fromCharCode(65 + Math.floor(i / 26) - 1);
                const secondChar = String.fromCharCode(65 + (i % 26));
                labels.push(firstChar + secondChar);
            }
        }
        return labels;
    }

    function applyStudentPool() {
        const count = parseInt(document.getElementById('studentCount').value);
        const previewText = document.getElementById('studentPreviewText');
        
        if (isNaN(count) || count < 1) {
            previewText.innerText = "請輸入有效的人數喔！";
            previewText.style.color = "#e74c3c";
            return;
        }
        
        studentPool = generateStudentLabels(count);
        
        previewText.innerText = studentPool.join(' 、 ');
        previewText.style.color = "#d4af37";
        
        const display = document.getElementById('studentDisplay');
        display.innerText = "等待抽籤";
        display.style.color = "#fff";
        display.style.transform = "scale(1)";
        
        hideCorgi();
        updateStudentRemainingDisplay();
    }

    function updateStudentRemainingDisplay() {
        const remainingContainer = document.getElementById('studentRemaining');
        const drawBtn = document.getElementById('studentDrawBtn');
        
        if (studentPool.length > 0) {
            remainingContainer.innerText = studentPool.join(' 、 ');
            drawBtn.disabled = false;
        } else {
            remainingContainer.innerText = "籤筒已空！請重新更新人數。";
            drawBtn.disabled = true;
        }
    }

    function hideCorgi() {
        document.getElementById('corgi-container').classList.remove('show');
        document.getElementById('student-corgi-container').classList.remove('show');
    }

    function showCorgiAndConfetti(corgiId) {
        document.getElementById(corgiId).classList.add('show');
        
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 5,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#d4af37', '#f1c40f', '#ffffff']
            });
            confetti({
                particleCount: 5,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#d4af37', '#f1c40f', '#ffffff']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }

    function startDraw() {
        if (pool.length === 0 || isDrawing) return;
        
        isDrawing = true;
        const drawBtn = document.getElementById('drawBtn');
        const display = document.getElementById('display');
        
        drawBtn.disabled = true;
        display.style.color = "#fff";
        display.style.transform = "scale(1)";
        hideCorgi();

        let ticks = 0;
        const maxTicks = 30;
        const speed = 70;    

        const timer = setInterval(() => {
            const randomIndex = Math.floor(Math.random() * pool.length);
            display.innerText = pool[randomIndex];
            ticks++;

            if (ticks >= maxTicks) {
                clearInterval(timer);
                
                const finalIndex = Math.floor(Math.random() * pool.length);
                const result = pool[finalIndex];
                
                pool.splice(finalIndex, 1);
                
                display.innerText = result;
                display.style.color = "#d4af37"; 
                display.style.transform = "scale(1.1)";
                
                showCorgiAndConfetti('corgi-container'); 
                updateRemainingDisplay();
                isDrawing = false;
            }
        }, speed);
    }

    function startStudentDraw() {
        if (studentPool.length === 0 || isStudentDrawing) return;
        
        isStudentDrawing = true;
        const drawBtn = document.getElementById('studentDrawBtn');
        const display = document.getElementById('studentDisplay');
        
        drawBtn.disabled = true;
        display.style.color = "#fff";
        display.style.transform = "scale(1)";
        hideCorgi(); 

        let ticks = 0;
        const maxTicks = 35; 
        const speed = 60;    

        const timer = setInterval(() => {
            const randomIndex = Math.floor(Math.random() * studentPool.length);
            display.innerText = "學生 " + studentPool[randomIndex];
            ticks++;

            if (ticks >= maxTicks) {
                clearInterval(timer);
                
                const finalIndex = Math.floor(Math.random() * studentPool.length);
                const result = studentPool[finalIndex];
                
                studentPool.splice(finalIndex, 1);
                
                display.innerText = "學生 " + result;
                display.style.color = "#d4af37"; 
                display.style.transform = "scale(1.1)"; 
                
                showCorgiAndConfetti('student-corgi-container'); 
                updateStudentRemainingDisplay();
                isStudentDrawing = false;
            }
        }, speed);
    }

    window.onload = () => {
        initSelectors();
        applyPool();
        applyStudentPool();
    };
</script>

</body>
</html>
